name: Update fund NAV history

on:
  schedule:
    # 台灣時間約晚上 7 點
    - cron: "0 11 * * 1-5"

    # 台灣時間約晚上 9 點，再補抓一次
    - cron: "0 13 * * 1-5"

  workflow_dispatch:


permissions:
  contents: write

jobs:
  update-fund-nav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4

      - name: Update fund NAV history
        run: |
          python scripts/update_fund_nav.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fund_nav_history.csv

          if git diff --cached --quiet; then
            echo "No new NAV data"
          else
            git commit -m "Update fund NAV history"
            git push
          fi
