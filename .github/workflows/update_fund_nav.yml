name: Update fund NAV history

on:
  schedule:
    # UTC 14:00 = 台灣時間 22:00
    # 週一至週五執行
    - cron: "0 14 * * 1-5"

  # 允許從 Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fund-nav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4

      - name: Update fund NAV history
        run: |
          python scripts/update_fund_nav.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fund_nav_history.csv

          if git diff --cached --quiet; then
            echo "No new NAV data"
          else
            git commit -m "Update fund NAV history"
            git push
          fi
